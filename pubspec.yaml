name: webrtcapptest
description: "WebRTC Audio & Video Calling Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.6

  # HTTP Client & Local Storage
  http: ^1.2.1
  shared_preferences: ^2.2.3

  # WebRTC & Signaling
  flutter_webrtc: ^0.12.5
  web_socket_channel: ^3.0.0

  # Permissions & System Drawer Notifications
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.1.0

  # Ringtone Sound Player (Modern AGP 8+ version without jcenter)
  flutter_ringtone_player: ^4.0.0+4

  # UI Utilities & Styling
  flutter_easyloading: ^3.0.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
